# Runs the existing checks on every pull request and push to main. No secrets are used: unit suites run
# offline against fixtures, and the DB suites run against a disposable local Supabase started in the runner
# (scripts refuse any non-local host).
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  NODE_VERSION: 22
  # Public placeholders so `next build` can inline NEXT_PUBLIC_* values; nothing connects to them.
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
jobs:
  build-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '${{ env.NODE_VERSION }}', cache: npm}
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run build
      # After the build: next build generates the global route types (LayoutProps, PageProps) tsc needs.
      - run: npx tsc --noEmit
      - name: Install test browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Unit and fixture suites
        run: |
          set -e
          for s in test:plans test:phase3 test:push test:safety test:hardening test:webhook test:billing test:tickets test:billing-support test:mcp test:leads test:production test:widget; do
            echo "::group::$s"; npm run -s $s; echo "::endgroup::"
          done
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '${{ env.NODE_VERSION }}', cache: npm}
      - run: npm ci
      - run: sudo apt-get install -y zsh >/dev/null
      - name: Start disposable Supabase
        run: |
          mkdir -p .supabase-local
          npx -y supabase@latest init --workdir .supabase-local --force >/dev/null
          npx -y supabase@latest start --workdir .supabase-local -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,supavisor,realtime,storage-api
      - name: Apply db/001..N and seed fixtures
        run: |
          node scripts/local-db-apply.mjs
          node scripts/local-db-seed.mjs
      - name: DB suites (rollback-only)
        run: zsh scripts/local-db-verify.sh
      - name: Widget key end to end (local app on the local database)
        run: |
          npx playwright install --with-deps chromium
          eval "$(npx -y supabase@latest status --workdir .supabase-local -o env | grep -E '^(ANON_KEY|SERVICE_ROLE_KEY)=')"
          NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321 NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
            npx next dev -p 3100 > /tmp/e2e-app.log 2>&1 &
          for i in $(seq 1 90); do curl -sf -o /dev/null http://localhost:3100/widget.js && break; sleep 1; done
          E2E_APP=http://localhost:3100 node scripts/verify-widget-key-e2e.mjs
      - name: Plans end to end (local app, local auth, mock PayPal)
        run: |
          eval "$(npx -y supabase@latest status --workdir .supabase-local -o env | grep -E '^(ANON_KEY|SERVICE_ROLE_KEY)=')"
          pkill -f "next dev -p 3100" || true; sleep 2; rm -rf .next/dev  # a dev cache from a server with other env values makes pages reload in a loop
          PAYPAL_API_BASE=http://127.0.0.1:8790 PAYPAL_CLIENT_ID=mock-client PAYPAL_CLIENT_SECRET=mock PAYPAL_WEBHOOK_ID=WH-TEST \
            NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321 NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
            npx next dev -p 3100 > /tmp/e2e-plan-app.log 2>&1 &
          for i in $(seq 1 90); do curl -sf -o /dev/null http://localhost:3100/widget.js && break; sleep 1; done
          E2E_APP=http://localhost:3100 SUPABASE_URL=http://127.0.0.1:54321 ANON_KEY="$ANON_KEY" SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" node scripts/verify-plan-e2e.mjs
          E2E_APP=http://localhost:3100 SUPABASE_URL=http://127.0.0.1:54321 ANON_KEY="$ANON_KEY" SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" node scripts/verify-chat-api-e2e.mjs
          E2E_APP=http://localhost:3100 node scripts/verify-push-sw.mjs
          E2E_APP=http://localhost:3100 SUPABASE_URL=http://127.0.0.1:54321 ANON_KEY="$ANON_KEY" SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" node scripts/verify-bot-stats-e2e.mjs
          E2E_APP=http://localhost:3100 SUPABASE_URL=http://127.0.0.1:54321 ANON_KEY="$ANON_KEY" SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" node scripts/verify-a11y.mjs --all
      - if: failure()
        uses: actions/upload-artifact@v4
        with: {name: db-logs, path: /tmp/ap-db-logs, retention-days: 7}
