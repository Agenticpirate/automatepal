services:
  - type: web
    name: automatepal
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: GEMINI_API_KEY
        sync: false
      - key: NODE_VERSION
        value: 22
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-5-5
      - key: LLM_DAILY_USD_CAP
        value: "1.00"
      - key: CONTEXT_DEV_API_KEY
        sync: false
      - key: BILLING_ENCRYPTION_KEYS
        sync: false
      - key: BILLING_ENCRYPTION_ACTIVE_KID
        value: k1
      - key: BILLING_RPC_SECRET
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: APP_MODE
        sync: false
      - key: APP_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: ALERT_WEBHOOK_URL
        sync: false
